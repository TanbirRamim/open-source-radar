# Open Source Radar: data pipeline configuration.
# Edit this file (not the generated output) to change what the radar tracks.

[discovery]
# A repository qualifies when it is popular, active, and has issues labeled for newcomers.
min_stars = 500
pushed_within_days = 60
# Repositories per language taken from each search (sorted by stars, max 100 per page).
repos_per_language = 100
# Search pages per language per label qualifier (each page is up to 100 repositories).
pages_per_query = 2

[issues]
# Issues updated longer ago than this are treated as stale and skipped.
updated_within_days = 180
# Newcomer-oriented label names to collect (matched case-sensitively by GitHub, so list variants).
labels = [
  "good first issue", "good-first-issue", "Good First Issue", "Good first issue",
  "good first bug", "first-timers-only", "first timers only",
  "help wanted", "help-wanted", "Help Wanted", "status: help wanted", "E-help-wanted",
  "beginner", "beginner friendly", "beginner-friendly", "Beginner",
  "easy", "Easy", "E-easy", "difficulty: easy", "difficulty/easy", "level: easy",
  "up-for-grabs", "up for grabs", "contributions welcome", "PR welcome", "PRs welcome", "hacktoberfest",
]
# Issues fetched per repository per run (most recently updated first).
per_repo = 30
# Maximum issues rendered per Markdown page (the website shows everything).
max_per_page = 200

[safety]
# A full run that finds fewer than this share of the previous run's issues is rejected
# (usually a sign of API errors or rate limits, not a real change).
min_ratio = 0.6

[exclude]
# Projects whose maintainers asked not to be listed: "owner/repo" or "owner/*".
repositories = []

[policy]
# Contribution files are re-scanned only when older than this.
refresh_days = 7

