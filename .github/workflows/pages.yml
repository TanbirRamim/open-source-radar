name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/radar.py", "scripts/config.toml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build site data from the committed issue data
        run: python scripts/radar.py render
      # Browsers keep old copies of app.js and i18n.js, which then miss new strings (a raw
      # "filters.more" showed up for a while). Stamp every asset link with the commit so a deploy busts them.
      - name: Version asset links
        run: find site -name '*.html' -exec sed -i -E "s#(assets/[a-z]+\.(js|css))\"#\1?v=${GITHUB_SHA::8}\"#g" {} +
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
