name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**", "issues/**", "projects/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover scripts -v

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ruff
        run: |
          pip install ruff
          ruff check scripts
          ruff format --check scripts
      - name: Website script syntax
        run: node --check site/assets/app.js
      - name: Render smoke test
        run: python scripts/radar.py render

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative links in the guide and docs
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress "*.md" "guide/*.md" "languages/*.md" "docs/*.md"
          fail: true
