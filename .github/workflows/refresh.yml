name: Refresh issue data

on:
  schedule:
    - cron: "17 5,17 * * *"   # twice a day
  workflow_dispatch:
    inputs:
      languages:
        description: "Optional comma-separated subset of languages (for testing). Leave empty for a full run."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the pipeline
        run: python -m unittest discover scripts

      - name: Collect issues
        env:
          # A fine-grained personal access token with public read access (secret RADAR_TOKEN) gives a much
          # higher API rate limit. Without it, the built-in token works but full runs take longer.
          GITHUB_TOKEN: ${{ secrets.RADAR_TOKEN || github.token }}
          LANGUAGES: ${{ inputs.languages }}
        run: |
          if [ -n "$LANGUAGES" ]; then
            python scripts/radar.py all --languages "$LANGUAGES"
          else
            python scripts/radar.py all
          fi

      - name: Commit updated data
        if: ${{ inputs.languages == '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md issues data site/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: refresh issues $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
