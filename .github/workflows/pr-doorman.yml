name: pr-doorman

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  doorman:
    runs-on: ubuntu-latest
    steps:
      - uses: TanbirRamim/pr-doorman@v0
        with:
          # Small fixes don't need an issue (see CONTRIBUTING.md), so a missing link is only a note.
          linked-issue: note
