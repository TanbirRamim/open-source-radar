name: Bug report
description: Something on the website, in the feeds or in the pipeline doesn't work.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where?
      description: A link to the page or feed, or the command you ran.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Browser, OS, Python version, screenshots, error output. Whatever helps.
