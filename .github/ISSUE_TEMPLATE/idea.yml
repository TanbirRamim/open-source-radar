name: Idea
description: Suggest something that would make the radar more useful.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the problem first, then the change you have in mind.
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to build it?
      options:
        - "Yes, I'd like to work on it"
        - "Maybe, with some pointers"
        - "No, just suggesting"
